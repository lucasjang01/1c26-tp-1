version: "3.9"
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: ./app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  nginx:
    image: nginx:1.29.8
    ports:
      - "5555:80"
    volumes:
      - ./nginx_reverse_proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./store/static/files:/static:ro
    depends_on:
      - api

  graphite:
    image: graphiteapp/graphite-statsd:1.1.10-5
    volumes:
      - ./statsd.config.json:/opt/statsd/config/udp.js
      - ./graphite.storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf
    ports:
      - "8090:80"
      - "8125:8125/udp"
      - "8126:8126"

  grafana:
    image: grafana/grafana:11.5.10
    ports:
      - "80:3000"
    volumes:
      - grafana_config:/var/lib/grafana

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    depends_on:
      - graphite
    command: -storage_driver="statsd" -storage_driver_host="graphite:8125" -storage_driver_db="cadvisor" -storage_driver_buffer_duration="1s" --docker_only=true
    ports:
      - "8080:8080"
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:rw"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"

volumes:
  grafana_config:
    driver: local
  redis_data:
    driver: local

# To scale the api service locally (compose v2+):
# docker compose up --scale api=3 -d
